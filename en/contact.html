<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact & FAQ — Polyship AI Music</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>body { font-family: 'Pretendard', sans-serif; background-color: #0a0b10; color: #e2e8f0; }</style>
</head>
<body class="min-h-screen pb-16">
    <header class="sticky top-0 z-40 bg-[#0d0f17]/90 backdrop-blur-md border-b border-[#282d45]">
    <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="../en/" class="flex items-center gap-2.5 group">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-purple-600 via-indigo-600 to-purple-800 flex items-center justify-center shadow-lg shadow-purple-600/30">
          <i data-lucide="disc-3" class="w-5 h-5 text-white animate-spin" style="animation-duration: 9s;"></i>
        </div>
        <div class="flex items-center gap-1.5">
          <span class="text-xl font-black text-white group-hover:text-purple-400 transition-colors tracking-tight">POLYSHIP</span>
          <span class="px-1.5 py-0.5 text-[10px] font-extrabold bg-gradient-to-r from-purple-600 to-indigo-600 text-white rounded-md tracking-wider">AI MUSIC</span>
        </div>
      </a>
      <div class="flex items-center gap-4 text-xs">
        <a href="../en/" class="text-gray-300 hover:text-white flex items-center gap-1">
          <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Home
        </a>
      </div>
    </div>
  </header>
  <main class="max-w-4xl mx-auto px-4 mt-10 space-y-10">
    <div class="border-b border-[#282d45] pb-4">
      <span class="text-xs font-bold text-purple-400 uppercase tracking-wider">Help & Support</span>
      <h1 class="text-3xl font-black text-white mt-1">Contact & FAQ</h1>
    </div>
    <section class="bg-[#12141f] border border-[#282d45] p-6 sm:p-8 rounded-2xl space-y-4">
      <h2 class="text-xl font-bold text-white flex items-center gap-2">
        <i data-lucide="mail" class="w-5 h-5 text-purple-400"></i> Send Us a Message
      </h2>
      <form onsubmit="event.preventDefault(); alert('Message sent successfully!'); this.reset();" class="space-y-4 text-xs">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-gray-400 mb-1">Your Name *</label>
            <input type="text" required placeholder="John Doe" class="w-full bg-[#0d0f17] border border-[#282d45] rounded-lg p-2.5 text-white focus:border-purple-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-gray-400 mb-1">Email Address *</label>
            <input type="email" required placeholder="you@domain.com" class="w-full bg-[#0d0f17] border border-[#282d45] rounded-lg p-2.5 text-white focus:border-purple-500 focus:outline-none">
          </div>
        </div>
        <div>
          <label class="block text-gray-400 mb-1">Message *</label>
          <textarea rows="4" required placeholder="How can we help?" class="w-full bg-[#0d0f17] border border-[#282d45] rounded-lg p-2.5 text-white focus:border-purple-500 focus:outline-none"></textarea>
        </div>
        <button type="submit" class="px-6 py-2.5 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-extrabold rounded-xl transition shadow-lg shadow-purple-600/30">
          Submit Message
        </button>
      </form>
    </section>
  </main>
    <footer class="max-w-5xl mx-auto px-4 mt-16 pt-8 border-t border-[#282d45] text-xs text-gray-400">
    <div class="flex flex-col sm:flex-row items-center justify-between gap-4 pb-6">
      <div class="flex items-center gap-2">
        <span class="font-black text-white">POLYSHIP AI MUSIC</span>
        <span>•</span>
        <span>Open Generative AI Sound Hub</span>
      </div>
      <div class="flex flex-wrap items-center gap-4 text-xs font-medium">
        <a href="./privacy.html" class="hover:text-purple-400 transition">Privacy Policy</a>
        <a href="./terms.html" class="hover:text-purple-400 transition">Terms of Service</a>
        <a href="./license.html" class="hover:text-purple-400 transition">License & Copyright</a>
        <a href="./contact.html" class="hover:text-purple-400 transition">Contact & FAQ</a>
      </div>
    </div>
    <p class="text-center sm:text-left text-[11px] text-gray-500">© 2026 Polyship AI Music (jake12733). All rights reserved. Google AdSense & Search Console Optimized.</p>
  </footer>
  <script>lucide.createIcons();</script>
</body>
</html>
